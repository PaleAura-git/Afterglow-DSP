[project]
name = "afterglow"
version = "0.1.0"
description = "A cozy terminal music player for Spotify"
authors = [
    { name = "PaleAura", email = "212019147+PaleAura-git@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
]

[project.scripts]
afterglow = "afterglow:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
